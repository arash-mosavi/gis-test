<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iran Cities Map with SLD Styling</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
      integrity="sha256-sA+e2hCf0WjFSmj9o+aiW17WmzHjAykuhFo3gZk0P+M="
      crossorigin=""
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #map {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
      integrity="sha256-GZC6CZYYg+/sW4Y3PTcKwluJf3Pu5JdoWJtftCuuH94="
      crossorigin=""
    ></script>
    <script>
      // Initialize the map and set view to Iran
      const map = L.map('map').setView([32.0, 53.0], 5);

      // Add OpenStreetMap base layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      // Add WMS overlay for 'cities' layer with SLD styling
      const wmsUrl = 'http://localhost:8080/wms';
      L.tileLayer
        .wms(wmsUrl, {
          layers: 'cities',
          format: 'image/png',
          transparent: true,
          version: '1.1.1',
          // Use SLD file for styling
          sld: 'blue_cities_correct.sld',
          // Use geographic CRS for WMS
          crs: L.CRS.EPSG4326,
        })
        .addTo(map);
    </script>
  </body>
</html>
